[package]
name = "alacritree_session_backend"
version = "0.0.0"
license = "Apache-2.0"
description = "What alacritree asks of whatever runs a session's terminal"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# The scripted backend, and the `Scripted` kind it answers under, for other
# crates' tests.
test-support = []

[dependencies]
alacritree_common.workspace = true
alacritree_multiplexer.workspace = true
alacritty_terminal = { path = "../../alacritty_terminal" }
ambassador.workspace = true
strum = { version = "0.28", features = ["derive"] }
thiserror.workspace = true
