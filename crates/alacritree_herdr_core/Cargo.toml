[package]
name = "alacritree_herdr_core"
version = "0.0.0"
license = "Apache-2.0"
description = "The session backend that runs each terminal in a herdr-core core"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
alacritree_common.workspace = true
alacritree_session_backend.workspace = true
alacritty_terminal = { path = "../../alacritty_terminal" }
log = "0.4"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
