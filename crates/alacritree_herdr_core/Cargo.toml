[package]
name = "alacritree_herdr_core"
version = "0.0.0"
license = "Apache-2.0"
description = "The session backend that runs each terminal in a herdr-core core"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# A way to kill the `hc connect` child, so a test can drop the connection.
test-support = []

[dependencies]
alacritree_common.workspace = true
alacritree_process_probe.workspace = true
alacritree_session_backend.workspace = true
alacritty_terminal = { path = "../../alacritty_terminal" }
log = "0.4"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
thiserror.workspace = true
toml_edit.workspace = true

[dev-dependencies]
alacritree_herdr_core = { path = ".", features = ["test-support"] }
tempfile = "3"

# The job object that counts every process the WSL e2e test starts.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }
