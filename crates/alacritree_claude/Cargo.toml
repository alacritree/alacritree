[package]
name = "alacritree_claude"
version = "0.0.0"
license = "Apache-2.0"
description = "Sets up Claude Code in alacritree's new worktrees"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
alacritree_checkout_hooks.workspace = true
alacritree_common.workspace = true
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
toml = { workspace = true }
