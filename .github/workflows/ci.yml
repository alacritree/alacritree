name: CI

# Branch work is checked through its pull_request run, so a push to a branch
# with an open PR does not build the same commit twice. Only master pushes
# run directly, so every merge gets checked.
on:
  push:
    branches: [master]
  pull_request:

# A newer push to a PR cancels its still-running older run. master keeps every
# run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always

# Every cargo command runs from the workspace root without `-p` or
# `--workspace`, so `default-members` keeps it off the vendored alacritty crates.
jobs:
  # rustfmt.toml needs nightly. The pin keeps CI and a local nightly from
  # disagreeing about the same file.
  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Rust toolchain
        run: rustup toolchain install nightly-2026-09-12 --profile minimal --component rustfmt

      - name: Format
        run: cargo +nightly-2026-09-12 fmt --check

  # Each OS lints its own cfg branches: the Windows process spawning in
  # alacritree_common's wsl.rs and wsl_helper.rs, and the macOS arms of links.rs
  # and session.rs, are lint-visible nowhere else.
  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      # eframe (winit + glow), arboard (X11/Wayland clipboard), and the unix
      # fontconfig dep all need C headers that aren't on the runner by default.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config \
            libfreetype6-dev libfontconfig1-dev \
            libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config fontconfig freetype

      - name: Rust toolchain
        run: rustup show && rustup component add clippy

      # A cache that fails to restore or save costs build time and nothing else.
      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # --no-deps keeps clippy on our own crates. The vendored
      # alacritty_terminal is #![deny(clippy::all)], so a lint that a newer
      # toolchain adds would fail CI in code we cannot edit.
      #
      # disallowed_methods is the backstop for a process wait written inline in
      # a UI handler, so it alone is denied. Other lints stay warnings.
      - name: Clippy
        run: cargo clippy --all-targets --locked --no-deps -- -D clippy::disallowed_methods

      # Pinned: the audit parses ast-grep's JSON, and an upgrade that moves that
      # format would leave it inspecting nothing. The script exits 2 on an empty
      # scan rather than reporting a clean one, so a stale pin is loud.
      - name: ast-grep
        if: runner.os == 'Linux'
        run: npm install -g @ast-grep/cli@0.45.1

      # The `jobs::Blocking` token is a compile-time gate, but `on_this_thread`
      # is public by design, so a handler can still hand itself a token. This is
      # what catches that. The script reads source text and does not evaluate
      # cfg, so one platform covers every target's code.
      - name: UI-thread audit
        if: runner.os == 'Linux'
        run: python3 alacritree/tools/ui-thread-audit.py .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config \
            libfreetype6-dev libfontconfig1-dev \
            libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config fontconfig freetype

      - name: Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Test
        run: cargo test --locked
